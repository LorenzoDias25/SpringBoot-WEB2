<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensalidades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link th:href="@{/css/mensalidades.css}" rel="stylesheet">
</head>

<body>
  <div class="container mt-3 mb-3">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg content-block navbar-custom">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{index}"><img th:src="@{/assets/logo.png}" style="height: 75px; width: auto;"
            alt="Logo"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" th:href="@{index}">Eventos</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ALUNO')">
              <a class="nav-link" th:href="@{perfil}">Perfil</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <section class="content-block">
      <div class="input-group search-bar-custom mb-3">
        <input type="text" class="form-control" placeholder="Pesquisar" id="inputPesquisa" />
        <select id="selectStatus" class="form-control" style="display: none">
          <option value="prazo">Prazo</option>
          <option value="vencida">Vencida</option>
          <option value="paga">Paga</option>
          <option value="cancelada">Cancelada</option>
        </select>
        <button class="btn" type="button" id="botaoPesquisa">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <div class="row filter-group align-items-center">
        <div class="col-auto">Pesquisar por:</div>
        <div class="col-auto">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pesquisarPor" id="radioEmissao" value="emissao"
              checked />
            <label class="form-check-label" for="radioEmissao">Emissão</label>
          </div>
        </div>
        <div class="col-auto">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pesquisarPor" id="radioVencimento" value="vencimento" />
            <label class="form-check-label" for="radioVencimento">Vencimento</label>
          </div>
        </div>
        <div class="col-auto">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pesquisarPor" id="radioValor" value="valor" />
            <label class="form-check-label" for="radioValor">Valor</label>
          </div>
        </div>
        <div class="col-auto">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="pesquisarPor" id="radioStatus" value="status" />
            <label class="form-check-label" for="radioStatus">Status</label>
          </div>
        </div>
      </div>
    </section>
    <section class="content-block text-center">
      <h2 style="font-size: 2.5rem">Mensalidades</h2>

      <div class="table-responsive mt-3 table-scrollable">
        <table class="table table-custom text-center">
          <thead>
            <tr>
              <th scope="col">Emissão</th>
              <th scope="col">Vencimento</th>
              <th scope="col">Valor</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="tabela">
          </tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/mensalidades.js}" defer></script>
</body>

</html>
