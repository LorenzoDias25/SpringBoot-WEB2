<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link th:href="@{/css/login.css}" rel="stylesheet">
  <!-- <link href="/static/css/login.css" rel="stylesheet"> -->
</head>

<body>

  <div class="background-image"></div>

  <div class="login-card">

    <h1 class="login-title">Faça seu login</h1>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="inputEmail" class="form-label">Email</label>
        <input type="text" class="form-control" id="inputEmail" name="username" required>
      </div>

      <div class="mb-3">
        <label for="inputSenha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="inputSenha" name="password" required>
      </div>

      <button type="submit" class="btn btn-login">Entrar</button>

      <div th:if="${param.error != null}" class="alert alert-danger mt-3" role="alert">
        Email ou Senha inválidos !
      </div>

      <div th:if="${param.logout != null}" class="alert alert-info mt-3" role="alert">
        Você saiu do sistema
      </div>

      <div class="forgot-password">
        Esqueceu sua senha ? <a href="#">Clique aqui</a>
      </div>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
